name: Daily blog post

# Generates and publishes one blog post automatically.
on:
  schedule:
    # 06:00 UTC every day. Change this to your local morning.
    # (e.g. "0 13 * * *" = 6am US Pacific, "0 1 * * *" = 6am Bangladesh.)
    - cron: "0 6 * * *"
  workflow_dispatch: {} # lets you run it on demand from the Actions tab

# Don't let two runs overlap.
concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Generate and publish a post
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run generate
