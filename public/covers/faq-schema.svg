<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Animated FAQ schema cover">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f5f3"/>
      <stop offset="1" stop-color="#eceae6"/>
    </linearGradient>
    <filter id="soft3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#16130f" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg3)"/>

  <!-- drifting accent blobs -->
  <g opacity="0.16">
    <circle cx="150" cy="130" r="90" fill="#1689c4">
      <animate attributeName="cy" values="130;160;130" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="510" r="120" fill="#6b46ff">
      <animate attributeName="cy" values="510;480;510" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1090" cy="120" r="54" fill="#2f8f5b">
      <animate attributeName="r" values="54;64;54" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- stacked Q&A accordion cards expanding -->
  <g filter="url(#soft3)" transform="translate(660,130)">
    <!-- card 1 -->
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="430" height="78" rx="16" fill="#ffffff" stroke="#e4e1dc" stroke-width="2"/>
      <circle cx="40" cy="39" r="15" fill="#6b46ff"/>
      <text x="40" y="46" font-family="Georgia, serif" font-size="20" fill="#fff" text-anchor="middle">Q</text>
      <rect x="74" y="26" width="240" height="12" rx="6" fill="#16130f" opacity="0.8"/>
      <rect x="74" y="48" width="180" height="9" rx="4.5" fill="#16130f" opacity="0.35"/>
      <text x="400" y="46" font-family="-apple-system, sans-serif" font-size="22" fill="#6b46ff" text-anchor="middle">
        +
        <animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/>
      </text>
    </g>
    <!-- card 2 (the open / answer card) -->
    <g transform="translate(0,94)">
      <rect x="0" y="0" width="430" height="120" rx="16" fill="#ffffff" stroke="#6b46ff" stroke-width="2"/>
      <circle cx="40" cy="39" r="15" fill="#ff6a35"/>
      <text x="40" y="46" font-family="Georgia, serif" font-size="20" fill="#fff" text-anchor="middle">A</text>
      <rect x="74" y="26" width="200" height="12" rx="6" fill="#16130f" opacity="0.8"/>
      <g fill="#16130f" opacity="0.35">
        <rect x="74" y="56" width="300" height="9" rx="4.5"><animate attributeName="width" values="0;300;300" dur="4s" repeatCount="indefinite"/></rect>
        <rect x="74" y="74" width="270" height="9" rx="4.5"><animate attributeName="width" values="0;270;270" dur="4s" begin="0.3s" repeatCount="indefinite"/></rect>
        <rect x="74" y="92" width="180" height="9" rx="4.5"><animate attributeName="width" values="0;180;180" dur="4s" begin="0.6s" repeatCount="indefinite"/></rect>
      </g>
    </g>
    <!-- card 3 -->
    <g transform="translate(0,228)">
      <rect x="0" y="0" width="430" height="78" rx="16" fill="#ffffff" stroke="#e4e1dc" stroke-width="2"/>
      <circle cx="40" cy="39" r="15" fill="#1689c4"/>
      <text x="40" y="46" font-family="Georgia, serif" font-size="20" fill="#fff" text-anchor="middle">Q</text>
      <rect x="74" y="26" width="210" height="12" rx="6" fill="#16130f" opacity="0.8"/>
      <rect x="74" y="48" width="160" height="9" rx="4.5" fill="#16130f" opacity="0.35"/>
      <text x="400" y="46" font-family="-apple-system, sans-serif" font-size="22" fill="#6b46ff" text-anchor="middle">
        +
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <!-- schema tag accent -->
  <text x="120" y="250" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#1689c4" opacity="0.8">&lt;script type="ld+json"&gt;</text>

  <!-- title -->
  <text x="120" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#16130f">FAQ schema</text>
  <text x="120" y="392" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#6b46ff">is not dead</text>
  <text x="122" y="442" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="22" fill="#6b6660">What it is, best practices &amp; implementation</text>
</svg>
