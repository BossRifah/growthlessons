<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Animated llms.txt cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f5f3"/>
      <stop offset="1" stop-color="#eceae6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#16130f" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- drifting accent blobs -->
  <g opacity="0.16">
    <circle cx="150" cy="120" r="90" fill="#6b46ff">
      <animate attributeName="cy" values="120;150;120" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1060" cy="520" r="120" fill="#1689c4">
      <animate attributeName="cy" values="520;490;520" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1090" cy="120" r="56" fill="#ff6a35">
      <animate attributeName="r" values="56;66;56" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- the file -->
  <g filter="url(#soft)" transform="translate(120,150)">
    <rect x="0" y="0" width="300" height="360" rx="22" fill="#ffffff" stroke="#e4e1dc" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="78" rx="22" fill="#6b46ff"/>
    <rect x="0" y="40" width="300" height="38" fill="#6b46ff"/>
    <text x="28" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#ffffff">llms.txt</text>
    <!-- content lines drawing in -->
    <g fill="#16130f" opacity="0.85">
      <rect x="28" y="120" width="180" height="14" rx="7">
        <animate attributeName="width" values="0;180;180" dur="5s" repeatCount="indefinite"/>
      </rect>
      <rect x="28" y="156" width="244" height="10" rx="5" opacity="0.55">
        <animate attributeName="width" values="0;244;244" dur="5s" begin="0.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="28" y="186" width="210" height="10" rx="5" opacity="0.55">
        <animate attributeName="width" values="0;210;210" dur="5s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="28" y="226" width="150" height="14" rx="7" fill="#ff6a35">
        <animate attributeName="width" values="0;150;150" dur="5s" begin="0.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="28" y="262" width="240" height="10" rx="5" opacity="0.55">
        <animate attributeName="width" values="0;240;240" dur="5s" begin="1.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="28" y="292" width="190" height="10" rx="5" opacity="0.55">
        <animate attributeName="width" values="0;190;190" dur="5s" begin="1.4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- signal flowing to AI nodes -->
  <g stroke="#6b46ff" stroke-width="2.5" fill="none" opacity="0.5" stroke-dasharray="6 10">
    <path d="M430 250 C 560 250, 600 175, 720 175">
      <animate attributeName="stroke-dashoffset" values="160;0" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M430 330 C 560 330, 600 330, 720 330">
      <animate attributeName="stroke-dashoffset" values="160;0" dur="2.2s" begin="0.4s" repeatCount="indefinite"/>
    </path>
    <path d="M430 410 C 560 410, 600 485, 720 485">
      <animate attributeName="stroke-dashoffset" values="160;0" dur="2.2s" begin="0.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- AI nodes -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#16130f">
    <g transform="translate(720,150)">
      <rect width="150" height="50" rx="25" fill="#ffffff" stroke="#e4e1dc" stroke-width="2"/>
      <circle cx="28" cy="25" r="9" fill="#2f8f5b"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/></circle>
      <text x="48" y="33">ChatGPT</text>
    </g>
    <g transform="translate(720,305)">
      <rect width="160" height="50" rx="25" fill="#ffffff" stroke="#e4e1dc" stroke-width="2"/>
      <circle cx="28" cy="25" r="9" fill="#1689c4"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
      <text x="48" y="33">Perplexity</text>
    </g>
    <g transform="translate(720,460)">
      <rect width="150" height="50" rx="25" fill="#ffffff" stroke="#e4e1dc" stroke-width="2"/>
      <circle cx="28" cy="25" r="9" fill="#ff6a35"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
      <text x="48" y="33">Gemini</text>
    </g>
  </g>

  <!-- title -->
  <text x="120" y="575" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#16130f">A curated map for AI systems</text>
</svg>
