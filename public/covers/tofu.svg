<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Animated top of funnel marketing cover">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f5f3"/>
      <stop offset="1" stop-color="#eceae6"/>
    </linearGradient>
    <linearGradient id="funnel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b46ff"/>
      <stop offset="1" stop-color="#1689c4"/>
    </linearGradient>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#16130f" flood-opacity="0.10"/>
    </filter>
    <clipPath id="funnelClip">
      <path d="M470 150 L880 150 L740 360 L740 500 L610 500 L610 360 Z"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#bg2)"/>

  <!-- drifting accent blobs -->
  <g opacity="0.16">
    <circle cx="150" cy="140" r="90" fill="#ff6a35">
      <animate attributeName="cy" values="140;170;140" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1070" cy="500" r="120" fill="#6b46ff">
      <animate attributeName="cy" values="500;470;500" dur="11s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- incoming audience dots falling into the funnel -->
  <g clip-path="url(#funnelClip)">
    <g fill="#ff6a35">
      <circle cx="540" cy="120" r="9"><animate attributeName="cy" values="120;500" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="675" cy="120" r="9" fill="#2f8f5b"><animate attributeName="cy" values="120;500" dur="2.6s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" dur="2.6s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="120" r="9" fill="#1689c4"><animate attributeName="cy" values="120;500" dur="2.6s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" dur="2.6s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="120" r="9"><animate attributeName="cy" values="120;500" dur="2.6s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" dur="2.6s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="120" r="9" fill="#2f8f5b"><animate attributeName="cy" values="120;500" dur="2.6s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" dur="2.6s" begin="2s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- funnel outline -->
  <path d="M470 150 L880 150 L740 360 L740 500 L610 500 L610 360 Z" fill="url(#funnel)" opacity="0.92" filter="url(#soft2)"/>
  <path d="M470 150 L880 150 L740 360 L740 500 L610 500 L610 360 Z" fill="none" stroke="#16130f" stroke-opacity="0.12" stroke-width="2"/>

  <!-- stage labels -->
  <g font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-weight="600" fill="#ffffff" font-size="22" text-anchor="middle">
    <text x="675" y="200">Awareness</text>
    <text x="675" y="290" font-size="18" opacity="0.9">Consideration</text>
    <text x="675" y="455" font-size="16" opacity="0.85">Decision</text>
  </g>

  <!-- converted lead exiting -->
  <circle cx="675" cy="520" r="10" fill="#2f8f5b">
    <animate attributeName="cy" values="500;560;560" dur="2.6s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="1s" repeatCount="indefinite"/>
  </circle>

  <!-- title -->
  <text x="120" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="56" fill="#16130f">Top of</text>
  <text x="120" y="395" font-family="Georgia, 'Times New Roman', serif" font-size="56" fill="#6b46ff">funnel marketing</text>
  <text x="122" y="445" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="22" fill="#6b6660">The complete 2026 guide</text>
</svg>
